# Runs on every pull request to the class registry.
name: Validate tools

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check that only tool folders changed
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          outside=$(echo "$changed" | grep -v -E '^registry/tools/[a-z_]+/[A-Za-z0-9_-]+/' || true)
          if [ -n "$outside" ]; then
            echo "::error::Pull requests may only change files in registry/tools/<tool_name>/<your_id>/. Also changed:"
            echo "$outside"
            exit 1
          fi

      - name: Validate changed tools and run their tests
        run: |
          dirs=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | cut -d/ -f1-4 | sort -u)
          status=0
          for d in $dirs; do
            if [ ! -f "$d/tool.json" ]; then echo "::error::$d has no tool.json"; status=1; continue; fi
            python -m graphkit.validate "$d" || status=1
            if [ -d "$d/tests" ]; then python -m pytest -q "$d/tests" || status=1; fi
          done
          exit $status
